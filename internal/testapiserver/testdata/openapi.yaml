# The OpenAPI 3 document the quirk server implements: a /things collection
# with the full create/read/update/delete lifecycle. This is the document a
# pipeline exercised against the standalone quirk server imports as its
# upstream — deliberately imperfect, the way a vendor's document is. The
# standalone quirks profile (StandaloneQuirks) deviates from what is written
# here in exactly the ways the audit exists to catch: fields this document
# calls writable are discarded, a documented default is not the served one,
# a documented requirement is not enforced, and fields the document never
# declares ride along on every read.
openapi: 3.0.3
info:
  title: quirkserver
  description: the deliberately-misbehaving stub API the toolkit rehearses against
  version: "1.0"
paths:
  /things:
    get:
      operationId: listThings
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thing'
    post:
      operationId: createThing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThingCreate'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
  /things/{thingId}:
    parameters:
      - name: thingId
        in: path
        schema:
          type: string
    get:
      operationId: getThing
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
    put:
      operationId: updateThing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThingCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
    delete:
      operationId: deleteThing
      responses:
        "204":
          description: gone
  # monitors is the multi-variant shape resource. The document declares its
  # fields flat and names only kind as required: it does not encode that kind
  # gates which other fields are valid, nor that interval — declared optional —
  # is really enforced. That partial oracle is the point: the audit discovers
  # the variant structure and the true requirement the document omits.
  /monitors:
    get:
      operationId: listMonitors
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Monitor'
    post:
      operationId: createMonitor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorCreate'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
  /monitors/{monitorId}:
    parameters:
      - name: monitorId
        in: path
        schema:
          type: string
    get:
      operationId: getMonitor
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
    put:
      operationId: updateMonitor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
    delete:
      operationId: deleteMonitor
      responses:
        "204":
          description: gone
  # assignments is the reference-requiring shape resource. agent_id is declared
  # a plain required string; that it must be the id of an agent /agents serves
  # is the semantic the audit discovers.
  /assignments:
    get:
      operationId: listAssignments
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
    post:
      operationId: createAssignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
  /assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        schema:
          type: string
    get:
      operationId: getAssignment
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
    put:
      operationId: updateAssignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
    delete:
      operationId: deleteAssignment
      responses:
        "204":
          description: gone
  # streams is the free-form-conditional shape resource. format and mode are
  # declared plain required enums; that format value-gates which mode is valid,
  # and that the API enforces it with vendor prose rather than the monitor's
  # parseable grammar, is what the audit discovers by value-cycling.
  /streams:
    get:
      operationId: listStreams
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stream'
    post:
      operationId: createStream
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamCreate'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
  /streams/{streamId}:
    parameters:
      - name: streamId
        in: path
        schema:
          type: string
    get:
      operationId: getStream
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
    put:
      operationId: updateStream
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamCreate'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
    delete:
      operationId: deleteStream
      responses:
        "204":
          description: gone
  # agents is the fixed pool assignment.agent_id draws from: list and read
  # only, no create.
  /agents:
    get:
      operationId: listAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        schema:
          type: string
    get:
      operationId: getAgent
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
components:
  schemas:
    ThingCreate:
      type: object
      required: [name, mode, code, notes]
      properties:
        name:
          type: string
        mode:
          type: string
          enum: [basic, advanced]
        query:
          type: string
          x-tfpfgen-required-when:
            property: mode
            equals: advanced
        code:
          type: string
          example: MiXeD
        notes:
          type: string
          example: some notes
        color:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        retention:
          type: integer
          default: 30
    Thing:
      allOf:
        - $ref: '#/components/schemas/ThingCreate'
        - type: object
          properties:
            id:
              type: string
              readOnly: true
    MonitorCreate:
      type: object
      # Only kind is declared required. interval is really required too and the
      # per-kind fields are gated by kind's value, but the document says none of
      # that — the audit finds it.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [ping, web, dns]
        name:
          type: string
        interval:
          type: integer
        target_host:
          type: string
        domain:
          type: string
        dnssec:
          type: boolean
        web:
          type: object
          properties:
            url:
              type: string
            method:
              type: string
    Monitor:
      allOf:
        - $ref: '#/components/schemas/MonitorCreate'
        - type: object
          properties:
            id:
              type: string
              readOnly: true
    AssignmentCreate:
      type: object
      required: [name, agent_id]
      properties:
        name:
          type: string
        agent_id:
          type: string
    Assignment:
      allOf:
        - $ref: '#/components/schemas/AssignmentCreate'
        - type: object
          properties:
            id:
              type: string
              readOnly: true
    Agent:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        region:
          type: string
    StreamCreate:
      type: object
      # format and mode are declared plain required enums. That format
      # value-gates which mode is valid — and that the API says so in vendor
      # prose, not the monitor's parseable grammar — is what the audit finds by
      # value-cycling.
      required: [name, format, mode]
      properties:
        name:
          type: string
        format:
          type: string
          enum: [avro, json, locked]
        mode:
          type: string
          enum: [batch, streaming]
    Stream:
      allOf:
        - $ref: '#/components/schemas/StreamCreate'
        - type: object
          properties:
            id:
              type: string
              readOnly: true
