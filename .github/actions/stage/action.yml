name: stage
description: >-
  One pipeline stage: restore the artifacts a verb consumes, run the verb,
  upload the artifact it produces. Each generate-pipeline job downstream of
  config validation is exactly one invocation of this action, so the arrows
  between jobs are named artifacts and nothing else.

inputs:
  verb:
    description: The tfpfgen command line to run, e.g. "spec import".
    required: true
  restore:
    description: >-
      Comma-separated artifact names to download into the workspace before
      the verb runs.
    required: false
    default: ""
  produce:
    description: Artifact name to upload after the verb succeeds.
    required: false
    default: ""
  paths:
    description: Paths to upload as the produced artifact.
    required: false
    default: ""
  include-hidden:
    description: >-
      Include hidden files in the produced artifact. Needed when a tree
      carries dotfiles (.gitignore, .openapi-generator-ignore); the paths
      must then exclude .git explicitly.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Name the artifacts to restore
      id: plan
      if: inputs.restore != ''
      shell: bash
      env:
        RESTORE: ${{ inputs.restore }}
      run: |
        set -euo pipefail
        # download-artifact takes one name or one glob, not a list. Its
        # patterns brace-expand, so a comma list becomes {a,b}. The trailing
        # comma keeps a single name expanding — a lone {a} is literal — and
        # the empty alternative it adds matches no artifact.
        echo "pattern={$(printf '%s' "$RESTORE" | tr -d '[:space:]'),}" >> "$GITHUB_OUTPUT"

    - name: Restore artifacts
      if: inputs.restore != ''
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        pattern: ${{ steps.plan.outputs.pattern }}
        merge-multiple: true
        path: .

    - name: Run the verb
      shell: bash
      env:
        VERB: ${{ inputs.verb }}
      run: |
        set -euo pipefail
        # Word-splitting is the point: "spec import" is two arguments.
        # shellcheck disable=SC2086
        tfpfgen ${VERB}

    # upload-artifact makes entries relative to the deepest directory every
    # listed path shares, so a stage producing spec/upstream.yaml and
    # spec/upstream.lock.json would upload them as upstream.yaml and
    # upstream.lock.json — and the stage that restores them would find them
    # loose in the workspace root instead of under spec/. Copying the paths
    # into one staging tree first, and uploading that tree's contents, keeps
    # every artifact entry at the path the next stage expects. The staging
    # tree is outside the workspace so it can never itself be collected.
    - name: Collect the produced paths, preserving their tree shape
      if: inputs.produce != ''
      id: collect
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        staged="${RUNNER_TEMP}/stage-produce"
        rm -rf "$staged"
        mkdir -p "$staged"
        found=0
        while IFS= read -r p; do
          p="$(printf '%s' "$p" | tr -d '[:space:]')"
          [ -z "$p" ] && continue
          if [ ! -e "$p" ]; then
            echo "::error::stage: the verb produced no '${p}' to upload."
            exit 1
          fi
          mkdir -p "$staged/$(dirname "$p")"
          cp -R "$p" "$staged/$(dirname "$p")/"
          found=1
        done <<< "$PATHS"
        if [ "$found" -eq 0 ]; then
          echo "::error::stage: produce was set but paths named nothing."
          exit 1
        fi
        echo "dir=$staged" >> "$GITHUB_OUTPUT"

    - name: Upload the produced artifact
      if: inputs.produce != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.produce }}
        path: ${{ steps.collect.outputs.dir }}/
        include-hidden-files: ${{ inputs.include-hidden }}
        # An empty artifact is a stage that silently produced nothing; the
        # next stage would fail further from the cause.
        if-no-files-found: error
