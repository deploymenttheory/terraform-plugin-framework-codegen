# Fails when the committed generated code no longer matches the blueprints it was
# generated from.
#
# Everything under pilot/ is produced by cmd/tfpluginframeworkgen. Nothing stops a change
# to the generator, a template or a blueprint from landing without the output being
# regenerated, and stale generated code compiles perfectly well -- so the drift
# would be invisible. This regenerates and fails if anything moved.
name: go | Verify generated code

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/codegen-verify.yml"
      - "blueprints/**"
      - "cmd/**"
      - "internal/**"
      - "interop-specs/**"
      - "probe-evidence/**"
      - "pilot/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "🔁 Regenerate and diff"
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.draft == false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # These jobs only read the tree; none of them runs git push.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
          cache: true

      - name: Download Dependencies
        run: |
          echo "::group::📦 Downloading Go modules"
          go mod download
          go mod verify
          echo "::endgroup::"

      # Generation reads only committed blueprints, so this needs no network and no
      # credentials.
      - name: Regenerate
        run: |
          echo "::group::🔁 Regenerating the pilot provider"
          go run ./cmd/tfpluginframeworkgen emit \
            -blueprint blueprints/thousandeyes \
            -out pilot/thousandeyes
          echo "::endgroup::"

      # git diff rather than `tfpluginframeworkgen verify`, deliberately. verify compares
      # the files the blueprints produce against disk, so it cannot see a stale file
      # the blueprints no longer produce. Diffing the worktree after a real
      # regeneration catches that too.
      - name: Check for drift
        run: |
          if git diff --quiet; then
            echo "✅ Generated code matches the blueprints."
            exit 0
          fi

          echo "::error::Generated code is out of date. Run 'go run ./cmd/tfpluginframeworkgen emit -blueprint blueprints/thousandeyes -out pilot/thousandeyes' and commit the result."
          {
            echo "### ❌ Generated code is out of date"
            echo ""
            echo "Run this locally and commit the result:"
            echo ""
            echo '```bash'
            echo 'go run ./cmd/tfpluginframeworkgen emit -blueprint blueprints/thousandeyes -out pilot/thousandeyes'
            echo '```'
            echo ""
            echo "<details><summary>Files that differ</summary>"
            echo ""
            echo '```'
            git diff --stat
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          git diff --stat
          exit 1

      # The toolkit's own gates. A generator change can produce a clean diff and
      # broken code, so a matching diff is necessary but not sufficient.
      - name: Build and test the toolkit
        run: |
          echo "::group::🔨 Build"
          go build ./...
          echo "::endgroup::"
          echo "::group::🧪 Test"
          go test ./...
          echo "::endgroup::"

      # The pilot is a separate module, so a root `go build ./...` silently skips
      # every generated file. This explicit entry is the only thing that compiles
      # the emitted code, which makes it the load-bearing step in this workflow.
      - name: Build and test the emitted provider
        working-directory: pilot/thousandeyes
        run: |
          echo "::group::📦 Download"
          go mod download
          echo "::endgroup::"
          echo "::group::🔨 Build"
          go build ./...
          echo "::endgroup::"
          echo "::group::🧪 Test"
          go test ./...
          echo "::endgroup::"

      # Emitted code must already be in the shape the target repository's formatter
      # would leave it, or a developer's editor rewrites it on first open and it
      # then shows as drift with no source change.
      #
      # Note the 2>/dev/null: gofumpt writes progress to stderr, and merging that
      # into the file list turns a cold module cache into a spurious failure.
      - name: Formatting is a fixed point
        run: |
          echo "::group::✨ gofumpt"
          unformatted=$(go run mvdan.cc/gofumpt@v0.9.1 -l . 2>/dev/null)
          echo "::endgroup::"

          if [ -z "$unformatted" ]; then
            echo "✅ Emitted code is a gofumpt fixed point."
            exit 0
          fi

          echo "::error::Emitted code is not gofumpt-clean. The generator must produce already-formatted output."
          {
            echo "### ❌ Emitted code is not gofumpt-clean"
            echo ""
            echo "The generator must emit already-formatted code, or the target repository's"
            echo "formatter will rewrite it and the next run will report drift."
            echo ""
            echo '```'
            echo "$unformatted"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$unformatted"
          exit 1

  bindings:
    name: "🔗 Verify SDK bindings"
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.draft == false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # These jobs only read the tree; none of them runs git push.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
          cache: true

      # A blueprint names SDK symbols as strings, so it can name one that does not
      # exist. That surfaces as a pile of identical compile errors in generated
      # code; this reports it against the blueprint field that is actually wrong.
      #
      # It runs as its own job because it type-checks the SDK, which is slower than
      # everything above it and independent of it.
      - name: Verify bindings against the pinned SDK
        run: |
          echo "::group::🔗 Bindings"
          go run ./cmd/tfpluginframeworkgen bindings \
            -blueprint blueprints/thousandeyes \
            -module pilot/thousandeyes
          echo "::endgroup::"

  interop:
    name: "🔀 Round-trip through tfplugingen-framework"
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.draft == false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # These jobs only read the tree; none of them runs git push.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
          cache: true

      # The exported specification is committed, so it drifts for the same reasons
      # the generated provider does.
      - name: Re-export and diff
        run: |
          echo "::group::🔀 Exporting"
          go run ./cmd/tfpluginframeworkgen interop export \
            -blueprint blueprints/thousandeyes \
            -out interop-specs/thousandeyes/provider-code-spec.json
          echo "::endgroup::"

          if git diff --quiet -- interop-specs/; then
            echo "✅ The exported specification matches the blueprints."
            exit 0
          fi

          echo "::error::interop-specs/ is out of date. Re-export it and commit the result."
          {
            echo "### ❌ The exported specification is out of date"
            echo ""
            echo '```bash'
            # Double quotes with an escaped backslash, not a single-quoted string ending
            # in one: the latter reads as an attempt to escape the closing quote. The text
            # has no expansion in it, so the quoting style makes no other difference.
            echo "go run ./cmd/tfpluginframeworkgen interop export \\"
            echo "  -blueprint blueprints/thousandeyes \\"
            echo '  -out interop-specs/thousandeyes/provider-code-spec.json'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git diff --stat -- interop-specs/
          exit 1

      # This job is the reason internal/interop exists.
      #
      # Our own tests assert the export satisfies HashiCorp's embedded JSON schema,
      # which is a structural claim. It is not the same claim as "a tool can render
      # it": the gap between the two is exactly where v0.4.1's known gaps live, and
      # only a third party can close it.
      #
      # It is a *blocking* job on purpose. A non-blocking check goes red within a
      # month and is ignored within two, at which point it is a standing lie about
      # the state of the export. Blocking is safe here because the input is fixed --
      # the committed document, not a freshly inferred one -- and the tool is pinned,
      # so the only thing that can break it is a change to our own mapping, which is
      # precisely what wants guarding.
      - name: Generate with the real tfplugingen-framework
        run: |
          echo "::group::📦 Installing tfplugingen-framework v0.4.1"
          go install github.com/hashicorp/terraform-plugin-codegen-framework/cmd/tfplugingen-framework@v0.4.1
          echo "::endgroup::"

          echo "::group::🏗️ Generating"
          tfplugingen-framework generate resources \
            --input interop-specs/thousandeyes/provider-code-spec.json \
            --output "$RUNNER_TEMP/gen"
          echo "::endgroup::"

          # Their generator exiting 0 having written nothing would pass under set -e,
          # so the output is asserted rather than assumed.
          if [ -z "$(find "$RUNNER_TEMP/gen" -name '*.go' -print -quit)" ]; then
            echo "::error::tfplugingen-framework produced no Go files from our export."
            exit 1
          fi

          echo "::group::✨ gofmt"
          cd "$RUNNER_TEMP/gen"
          unformatted=$(gofmt -l .)
          echo "::endgroup::"

          if [ -n "$unformatted" ]; then
            echo "::error::tfplugingen-framework produced Go that is not gofmt-clean, which means our export made it emit something malformed."
            echo "$unformatted"
            exit 1
          fi

          echo "✅ HashiCorp's own generator accepted the export and produced formatted Go."

  probe-replay:
    name: "🔬 Re-derive probe facts offline"
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.draft == false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Blocked rather than audited, unlike every other job here.
          #
          # What this proves, precisely: no host an API could live on is reachable, so a
          # regression that tried to derive facts from a live tenant fails here. What it does
          # *not* prove is that the job makes no network calls at all -- setting up Go and
          # fetching modules obviously do, and the hosts below are exactly those.
          #
          # The stronger guarantee lives in the tool: replay mode is given a cassette-backed
          # transport over cassette.DenyTransport, so a code path that bypassed the transcript
          # errors rather than dialling. This job is the belt to that braces, and the reason it
          # is worth having is that it would catch a change to the transport wiring itself.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            go.dev:443
            dl.google.com:443

      - name: Check Out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # These jobs only read the tree; none of them runs git push.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
          cache: true

      - name: Download Dependencies
        run: go mod download

      # The purity test. A committed cassette must yield exactly the facts committed with it,
      # derived from the transcript alone -- no clock, no environment, no network. If derivation
      # is not a pure function of the transcript then every fact in the store is unreproducible,
      # and the whole premise of committing HTTP evidence collapses.
      #
      # Deliberately no credentials in this job's environment. Not "unused" -- absent, so a
      # regression that reached for a live API fails here rather than passing quietly against a
      # tenant somebody happened to have access to.
      - name: Verify facts reproduce with no network
        run: |
          echo "::group::🔬 Replaying committed cassettes"
          go run ./cmd/tfpluginframeworkgen probe \
            -blueprint blueprints/thousandeyes \
            -mode verify
          echo "::endgroup::"

      # Committed evidence that nobody has folded in is evidence nobody is acting on.
      - name: The blueprint reflects the recorded facts
        run: |
          echo "::group::🔀 merge -check"
          for facts in probe-evidence/*/*/*/facts.json; do
            echo "checking $facts"
            go run ./cmd/tfpluginframeworkgen merge \
              -blueprint blueprints/thousandeyes \
              -facts "$facts" \
              -check \
              -accept-conflicts
          done
          echo "::endgroup::"
