name: 40-acceptance

# Live acceptance tests against the real API. The caller wires this to
# schedule and workflow_dispatch only — never push or pull_request, because
# it spends real API quota against real tenants — and passes its secrets
# with `secrets: inherit`. The named GitHub environment is the gate: its
# protection rules (required reviewers, branch restrictions) decide whether
# the run may proceed, and its secrets are the TF_<PROVIDER>_* values the
# provider under test reads.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment the acceptance run executes in; its protection rules gate the run.
        type: string
        required: true
      test_timeout:
        description: go test timeout for the acceptance run.
        type: string
        required: false
        default: 120m

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ inputs.environment }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      # A reusable workflow cannot name another provider's secrets, so the
      # generic contract is the glossary's operator namespace: every secret
      # matching TF_<PROVIDER>_* (TF_ then uppercase) is exported for the
      # provider under test to read. Values stay masked in logs; heredoc
      # delimiters keep multi-line values (private keys) intact.
      - name: Pass the provider's TF_* secrets through
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          jq -r 'keys[] | select(test("^TF_[A-Z0-9_]+$"))' <<<"$ALL_SECRETS" |
          while IFS= read -r key; do
            value="$(jq -r --arg k "$key" '.[$k]' <<<"$ALL_SECRETS")"
            delim="TFPFGEN_EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "${key}<<${delim}"
              printf '%s\n' "$value"
              echo "$delim"
            } >> "$GITHUB_ENV"
            echo "passed ${key} through"
          done
      - name: Run the acceptance tests
        env:
          TF_ACC: "1"
          TEST_TIMEOUT: ${{ inputs.test_timeout }}
        # -p 1: acceptance tests mutate shared live state; packages must not
        # run in parallel against the same tenant.
        run: go test -v -p 1 -timeout "$TEST_TIMEOUT" -run '^TestAcc' ./...
