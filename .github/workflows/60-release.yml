name: 60-release

# Publishes a provider release to the Terraform Registry: preflight the tree,
# import the signing key, and let goreleaser build, sign and upload. The
# chain follows HashiCorp's provider release workflow, folded into one
# numbered workflow_call. The caller wires the v* tag-push trigger and passes
# GPG_PRIVATE_KEY (and its passphrase, if the key has one) — the registry
# requires signed checksums.
on:
  workflow_call:
    inputs:
      git-ref:
        description: Branch, tag or SHA to release; defaults to the calling ref.
        type: string
        required: false
        default: ""
      goreleaser-release-args:
        description: Extra `goreleaser release` arguments.
        type: string
        required: false
        default: --verbose --timeout 120m0s
      setup-go-version-file:
        description: File setup-go reads the Go version from.
        type: string
        required: false
        default: go.mod
    secrets:
      gpg-private-key:
        description: GPG private key that signs the release checksums.
        required: true
      gpg-private-key-passphrase:
        description: Passphrase of the GPG private key, when it has one.
        required: false

permissions:
  contents: read

jobs:
  preflight:
    name: pre-release validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ inputs.git-ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ inputs.setup-go-version-file }}
          cache-dependency-path: go.sum
          cache: true
      - name: go mod tidy is a fixed point
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || \
            (echo "::error::go.mod/go.sum change under 'go mod tidy'; run it and commit."; exit 1)
      - name: Go build
        run: go build -v .
        env:
          CGO_ENABLED: 0

  release:
    name: goreleaser release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: preflight
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      # Full depth: goreleaser derives the version from the tag at HEAD, and
      # a shallow clone can hide the tag's ancestry.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.git-ref || github.ref }}
          fetch-depth: 0
      # A full multi-platform provider build has outgrown the standard
      # runner's disk before; clearing the preinstalled toolchains buys the
      # headroom without a larger runner.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ inputs.setup-go-version-file }}
          cache: false
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-private-key-passphrase }}
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          args: release --clean ${{ inputs.goreleaser-release-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
