name: Linter

on:
  pull_request:
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  packages: read
  statuses: write # To report GitHub Actions status checks
  
jobs:
  build:
    name: '✨ Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          
      - name: Lint Code Base with Super-Linter
        uses: super-linter/super-linter@61abc07d755095a68f4987d1c2c3d1d64408f1f9 # v8.5.0
        env:
          DEFAULT_BRANCH: origin/main
          VALIDATE_ALL_CODEBASE: false # tells the linter to only check files that have been modified in the current pull request

          # Go is linted by go-lint.yml, not here.
          #
          # Two reasons, and the second is decisive. First, these duplicate
          # go-lint.yml, which runs golangci-lint over the whole module with this
          # repository's own .golangci.yml -- and that config already enables
          # govet, gocyclo and the gofumpt/goimports/gci/golines formatters, so
          # super-linter's versions add nothing but a second opinion configured
          # differently.
          #
          # Second, with VALIDATE_ALL_CODEBASE false, super-linter invokes
          # golangci-lint with the list of *changed files*. golangci-lint rejects
          # named files spanning more than one directory:
          #
          #   typechecking error: named files must all be in one directory;
          #   have /github/workspace/internal/manifest and /github/workspace/cmd/tfprovidergen
          #
          # In a code generator almost every change touches several packages at
          # once, so this fails on ordinary pull requests regardless of whether
          # the code is correct. A check that cannot pass is worse than no check:
          # people learn to ignore it, and then ignore it when it means something.
          VALIDATE_GO: false
          VALIDATE_GOFMT: false
          VALIDATE_GOCYCLO: false
          VALIDATE_GOVET: false
          VALIDATE_GOLANGCI_LINT: false

          VALIDATE_CPD: false # Disable CPD (Copy Paste Detection) for all languages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # To report GitHub Actions status checks
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          FILTER_REGEX_EXCLUDE: |
            .*\.md$|                # Exclude all markdown files
            .*test/.*|              # Exclude all files in any test directory
            .*_test\.go$|           # Exclude Go test files (e.g., *_test.go)
            .*\.json$               # Exclude all JSON files
