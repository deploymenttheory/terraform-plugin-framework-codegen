name: ci

# Push and pull_request both, so main is measured directly rather than only
# through the pull requests that merge into it.
#
# Scoped to codegen: this workflow builds and tests the Go toolkit, so a
# change that touches only docs, the reusable pipeline workflows, the
# composite actions, or the release plumbing cannot affect its result.
# paths-ignore skips the run only when every changed file is one of these;
# a mixed change (any code file too) still runs. ci.yml itself is absent
# from the list, so editing the gate re-measures it.
on:
  push:
    branches: [main]
    paths-ignore: &non-code
      - '**.md'
      - 'docs/**'
      - '.github/workflows/10-generate.yml'
      - '.github/workflows/20-corrections.yml'
      - '.github/workflows/30-ci.yml'
      - '.github/workflows/40-acceptance.yml'
      - '.github/workflows/50-docs.yml'
      - '.github/workflows/60-release.yml'
      - '.github/workflows/diagrams.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *non-code

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Build, vet, test, coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: gofmt is a fixed point
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./internal/...
      - name: Coverage gate (total ≥90%, package ≥80%)
        run: bash scripts/coverage_gate.sh coverage.out

  lint:
    name: 🔍 Lint and repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: latest
      - name: Repo hygiene (file ceiling, pilot leakage, no binaries)
        run: bash scripts/repo_hygiene_gate.sh
