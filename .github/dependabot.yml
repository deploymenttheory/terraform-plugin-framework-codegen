# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    commit-message:
      # Prefix commit messages with "chore"; include: scope appends the
      # dependency scope automatically -> "chore(deps): " / "chore(deps-dev): "
      # This follows conventional commits and works with release-please
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      # Check for updates to Go modules every week
      interval: "weekly"
    commit-message:
      # Prefix commit messages with "chore"; include: scope appends the
      # dependency scope automatically -> "chore(deps): " / "chore(deps-dev): "
      # This follows conventional commits and works with release-please
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # The pilot provider is a separate Go module, so the entry above does not see
  # it. Without this its terraform-plugin-framework and SDK pins would never be
  # offered an update, and the pilot would silently drift away from the framework
  # version the rest of the organisation's providers are on.
  #
  # Note that an SDK bump here can invalidate the bindings recorded in
  # blueprints/: the "Verify SDK bindings" job in codegen-verify.yml is what
  # catches that, so review those pull requests on its result rather than on the
  # diff alone.
  - package-ecosystem: "gomod"
    directory: "/pilot/thousandeyes"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
