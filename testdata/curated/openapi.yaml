# The curated document: a fictional API invented for this repository, whose
# every name says which generator behaviour it is here to exercise rather
# than what it would mean in some domain. An entity is named for its
# lifecycle and a property for the shape it takes, so a reader can tell what
# a failure is about without reading the paths.
#
# It is deliberately small and deliberately complete: scalar, enum,
# nested-object, list and map attributes, a create-only property, an entity
# with no update, a value-conditional requirement, an eventual-consistency
# window, a put-full update style, a lookup-by-key datasource, a list-only
# entity, and an action.
openapi: 3.0.3
info:
  title: Curated Fixture API
  version: 1.0.0
servers:
  - url: https://api.example.test/api
paths:
  /patch-updated-resources:
    post:
      operationId: CreatePatchUpdatedResource
      x-tfpfgen-read-after-write: 45s
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPatchUpdatedResource'
      responses:
        "201":
          description: The created patchUpdatedResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchUpdatedResource'
    get:
      operationId: ListPatchUpdatedResources
      responses:
        "200":
          description: Every patchUpdatedResource.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatchUpdatedResource'
  /patch-updated-resources/{patchUpdatedResourceId}:
    parameters:
      - name: patchUpdatedResourceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetPatchUpdatedResource
      responses:
        "200":
          description: One patchUpdatedResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchUpdatedResource'
    patch:
      operationId: UpdatePatchUpdatedResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPatchUpdatedResource'
      responses:
        "200":
          description: The updated patchUpdatedResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchUpdatedResource'
    delete:
      operationId: DeletePatchUpdatedResource
      x-tfpfgen-delete-not-found-ok: true
      responses:
        "204":
          description: Deleted.
  /patch-updated-resources/{patchUpdatedResourceId}/custom-action:
    post:
      operationId: InvokeCustomAction
      parameters:
        - name: patchUpdatedResourceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomActionRequest'
      responses:
        "202":
          description: CustomAction accepted.
  /replace-only-resources:
    post:
      operationId: CreateReplaceOnlyResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceOnlyResource'
      responses:
        "201":
          description: The created replaceOnlyResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceOnlyResource'
    get:
      operationId: ListReplaceOnlyResources
      # The document below declares a bare array; the live API wraps its
      # items under "replaceOnlyResources". The audit's listWrapper observation is
      # what this key records, and generation reads it in preference to the
      # schema — the fixture's one deliberately-lying response.
      x-tfpfgen-list-wrapper:
        wrapped: true
        key: replaceOnlyResources
      x-tfpfgen-list-pagination: none
      responses:
        "200":
          description: Every replaceOnlyResource.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReplaceOnlyResource'
  /replace-only-resources/{replaceOnlyResourceId}:
    parameters:
      - name: replaceOnlyResourceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetReplaceOnlyResource
      responses:
        "200":
          description: One replaceOnlyResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceOnlyResource'
    delete:
      operationId: DeleteReplaceOnlyResource
      responses:
        "204":
          description: Deleted.
  /put-updated-resources:
    post:
      operationId: CreatePutUpdatedResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutUpdatedResource'
      responses:
        "201":
          description: The created putUpdatedResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutUpdatedResource'
    get:
      operationId: ListPutUpdatedResources
      responses:
        "200":
          description: Every putUpdatedResource.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PutUpdatedResource'
  /put-updated-resources/{putUpdatedResourceId}:
    parameters:
      - name: putUpdatedResourceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetPutUpdatedResource
      responses:
        "200":
          description: One putUpdatedResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutUpdatedResource'
    put:
      operationId: ReplacePutUpdatedResource
      x-tfpfgen-update-style: put-full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutUpdatedResource'
      responses:
        "200":
          description: The replaced putUpdatedResource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutUpdatedResource'
    delete:
      operationId: DeletePutUpdatedResource
      responses:
        "204":
          description: Deleted.
  /key-addressed-datasources/{keyAddressedDatasourceCode}:
    get:
      operationId: GetKeyAddressedDatasource
      parameters:
        - name: keyAddressedDatasourceCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The keyAddressedDatasource the code identifies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyAddressedDatasource'
  /list-only-datasources:
    get:
      operationId: ListListOnlyDatasources
      responses:
        "200":
          description: Every scheduled listOnlyDatasource.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListOnlyDatasource'
components:
  schemas:
    NewPatchUpdatedResource:
      type: object
      required:
        - requiredString
      properties:
        requiredString:
          type: string
          description: A required string.
        enumString:
          type: string
          enum:
            - optionOne
            - optionTwo
          description: A string closed to a declared set of values.
        immutableString:
          type: string
          x-tfpfgen-immutable: true
          description: A string a change to which forces re-creation.
        boolean:
          type: boolean
          description: A boolean.
        integer:
          type: integer
          description: An integer.
        number:
          type: number
          description: A number.
        listOfStrings:
          type: array
          items:
            type: string
          description: A list whose elements are strings.
        mapOfStrings:
          type: object
          additionalProperties:
            type: string
          description: A map whose values are strings.
        mapOfIntegers:
          type: object
          additionalProperties:
            type: integer
          description: A map whose values are integers.
        mapOfNumbers:
          type: object
          additionalProperties:
            type: number
          description: A map whose values are numbers.
        mapOfBooleans:
          type: object
          additionalProperties:
            type: boolean
          description: A map whose values are booleans.
        listOfLists:
          type: array
          items:
            type: array
            items:
              type: string
          description: A list whose elements are lists of strings.
        listOfMaps:
          type: array
          items:
            type: object
            additionalProperties:
              type: boolean
          description: A list whose elements are maps of booleans.
        mapOfLists:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
          description: A map whose values are lists of integers.
        mapOfMaps:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: A map whose values are maps of strings.
        mapOfNestedObjects:
          type: object
          additionalProperties:
            type: object
            required:
              - valueInteger
            properties:
              valueInteger:
                type: integer
                description: An integer inside a map value.
              valueBoolean:
                type: boolean
                description: A boolean inside a map value.
          description: A map whose values are objects.
        nestedObject:
          type: object
          x-tfpfgen-required-when:
            property: enumString
            equals: optionOne
          properties:
            nestedInteger:
              type: integer
              description: An integer inside a nested object.
            nestedBoolean:
              type: boolean
              description: A boolean inside a nested object.
          description: A nested object, required when enumString is optionOne.
        listOfNestedObjects:
          type: array
          items:
            type: object
            required:
              - elementString
            properties:
              elementString:
                type: string
                description: A string inside a list element.
              elementInteger:
                type: integer
                description: An integer inside a list element.
          description: A list whose elements are objects.
    PatchUpdatedResource:
      allOf:
        - $ref: '#/components/schemas/NewPatchUpdatedResource'
        - type: object
          required:
            - id
            - boolean
            - computedString
          properties:
            id:
              type: string
              readOnly: true
              description: The identifier.
            computedString:
              type: string
              readOnly: true
              description: A string only the API sets.
    CustomActionRequest:
      type: object
      required:
        - requiredString
      properties:
        requiredString:
          type: string
          description: A required string.
        boolean:
          type: boolean
          description: A boolean.
    ReplaceOnlyResource:
      type: object
      required:
        - requiredString
      properties:
        id:
          type: string
          readOnly: true
          description: The identifier.
        requiredString:
          type: string
          description: A required string.
        integer:
          type: integer
          description: An integer.
        boolean:
          type: boolean
          description: A boolean.
    PutUpdatedResource:
      type: object
      required:
        - requiredString
      properties:
        id:
          type: string
          readOnly: true
          description: The identifier.
        requiredString:
          type: string
          description: A required string.
        boolean:
          type: boolean
          description: A boolean.
    KeyAddressedDatasource:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The identifier.
        keyAddressedDatasourceCode:
          type: string
          description: The code stamped on the keyAddressedDatasource.
        plainString:
          type: string
          description: A string.
        integer:
          type: integer
          description: An integer.
    ListOnlyDatasource:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The identifier.
        firstString:
          type: string
          description: A string.
        secondString:
          type: string
          description: A second string.
